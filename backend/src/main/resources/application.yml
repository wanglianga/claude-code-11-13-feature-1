server:
  port: 8080

spring:
  application:
    name: rtbf-console
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/rtbf}
    username: ${DB_USERNAME:ccdev}
    password: ${DB_PASSWORD:ccdev}
    hikari:
      maximum-pool-size: 8
  flyway:
    enabled: true
    baseline-on-migrate: true
    default-schema: compliance
    schemas: compliance,biz
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  # 执行前可撤回延迟窗口（分钟），窗口内可撤回、候选人可撤回注销
  cancel-window-minutes: ${CANCEL_WINDOW_MINUTES:30}
  # 监管问询函要求的法定答复期限（工作日）
  legal-deadline-workdays: 15
  # 挂起仲裁：到期前多少天生成法务复核待办；挂起超过多少天且无新依据自动升级
  hold:
    review-lead-days: ${HOLD_REVIEW_LEAD_DAYS:3}
    legal-limit-days: ${HOLD_LEGAL_LIMIT_DAYS:180}
  evidence:
    dir: ${EVIDENCE_DIR:./evidence}

logging:
  level:
    com.example.rtbf: INFO
